<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LuyệnĐề</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1d2433;--mu:#6b7488;--pr:#3b6cf6;--pr2:#e8eeff;--ok:#16a34a;--okb:#e7f8ee;--er:#dc2626;--erb:#fdecec;--bd:#e2e6f0}
@media (prefers-color-scheme:dark){:root{--bg:#12151d;--card:#1b2030;--tx:#e8ecf5;--mu:#9aa3b8;--pr:#6d93ff;--pr2:#232c4a;--ok:#4ade80;--okb:#173225;--er:#f87171;--erb:#3a1f22;--bd:#2c3348}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header b{font-size:20px;color:var(--pr);cursor:pointer}
main{max-width:820px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h2{margin:0 0 12px;font-size:20px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:10px}
button.p{background:var(--pr);color:#fff;border-color:var(--pr)}
button.d{color:var(--er)}
input,textarea{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin:3px 0}
textarea{min-height:100px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.mu{color:var(--mu);font-size:14px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);cursor:pointer}
.opt.sel{background:var(--pr2);border-color:var(--pr)}.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.bad{background:var(--erb);border-color:var(--er)}
.timer{font-weight:700;color:var(--pr);font-variant-numeric:tabular-nums}
.score{font-size:44px;font-weight:800;color:var(--pr)}
.ex{background:var(--okb);border-left:3px solid var(--ok);padding:8px 12px;border-radius:8px;margin-top:8px;font-size:14px}
.qe{border:1px dashed var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.qe input[type=radio],input[type=checkbox]{width:auto}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left}
.bar{position:sticky;top:57px;z-index:4}
select{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.tb{min-width:64px}.tb.sel{background:var(--pr);color:#fff;border-color:var(--pr)}
</style>
</head>
<body>
<header><b onclick="location.hash='/'">📝 LuyệnĐề</b><span class="sp"></span><span id="who"></span></header>
<main id="app"></main>
<script>
const A=document.getElementById('app'),L='ABCD';
let tok=localStorage.getItem('t'),ed=null,tm=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
async function api(p,m='GET',b){
 const r=await fetch('/api'+p,{method:m,headers:{'content-type':'application/json',authorization:'Bearer '+(tok||'')},body:b?JSON.stringify(b):undefined});
 const d=await r.json().catch(()=>({}));
 if(r.status===401&&tok&&!p.match(/^\/(login|register)/)){logout();throw new Error(d.error)}
 if(!r.ok)throw new Error(d.error||'Lỗi '+r.status);return d;
}
const run=f=>async(...a)=>{try{await f(...a)}catch(e){alert(e.message)}};
function logout(){tok=null;localStorage.removeItem('t');location.hash='/';route()}
function route(){
 clearInterval(tm);window.scrollTo(0,0);
 $('who').innerHTML=tok?'<button onclick="logout()">Đăng xuất</button>':'';
 const h=location.hash.slice(1)||'/';let m;
 if(m=h.match(/^\/e\/(\w+)/))return student(m[1]);
 if(!tok)return login();
 if(m=h.match(/^\/edit\/(\w+)/))return editor(m[1]);
 if(m=h.match(/^\/results\/(\w+)/))return results(m[1]);
 dash();
}
addEventListener('hashchange',route);

/* ---------- Đăng nhập ---------- */
function login(){
 A.innerHTML=`<div class="card" style="max-width:400px;margin:40px auto"><h2>Dành cho giáo viên</h2>
 <input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Mật khẩu (≥ 6 ký tự)">
 <div class="row" style="margin-top:8px"><button class="p" onclick="auth('login')">Đăng nhập</button><button onclick="auth('register')">Đăng ký</button></div>
 <p class="mu">Học sinh không cần tài khoản: chỉ cần mở link đề giáo viên gửi.</p></div>`;
}
const auth=run(async k=>{const d=await api('/'+k,'POST',{email:$('em').value,password:$('pw').value});tok=d.token;localStorage.setItem('t',tok);route()});

/* ---------- Bảng điều khiển ---------- */
const dash=run(async()=>{
 const ex=await api('/exams');
 A.innerHTML=`<div class="card"><div class="row"><h2 class="sp">Đề của tôi</h2><button class="p" onclick="location.hash='/edit/new'">+ Tạo đề</button></div>
 ${ex.map(x=>`<div class="card" style="margin:10px 0 0"><b>${esc(x.title)}</b><div class="mu">${x.minutes} phút · ${x.subs} bài nộp</div>
 <div class="row" style="margin-top:8px"><button class="p" onclick="copyLink('${x.code}')">Sao chép link làm bài</button>
 <button onclick="location.hash='/results/${x.id}'">Bảng điểm</button><button onclick="location.hash='/edit/${x.id}'">Sửa</button>
 <button class="d" onclick="del('${x.id}')">Xóa</button></div></div>`).join('')||'<p class="mu">Chưa có đề nào. Bấm “Tạo đề”.</p>'}</div>`;
});
const copyLink=c=>{const u=location.origin+'/#/e/'+c;navigator.clipboard.writeText(u).then(()=>alert('Đã sao chép:\n'+u),()=>prompt('Link làm bài:',u))};
const del=run(async id=>{if(confirm('Xóa đề và toàn bộ bài nộp?')){await api('/exams/'+id,'DELETE');dash()}});

/* ---------- Soạn đề ---------- */
const editor=run(async id=>{
 ed=id==='new'?{title:'',minutes:15,shuffle:false,questions:[{q:'',o:['','','',''],a:0,e:''}]}:await api('/exams/'+id);
 ed._id=id;
 A.innerHTML=`<div class="card"><h2>${id==='new'?'Tạo đề mới':'Sửa đề'}</h2>
 <input placeholder="Tên đề thi" value="${esc(ed.title)}" oninput="ed.title=this.value">
 <div class="row"><span>Thời gian (phút):</span><input type="number" min="1" style="width:90px" value="${ed.minutes}" oninput="ed.minutes=+this.value||1">
 <label><input type="checkbox" ${ed.shuffle?'checked':''} onchange="ed.shuffle=this.checked"> Xáo trộn câu hỏi &amp; đáp án</label></div></div>
 <div class="card"><b>Nhập nhanh nhiều câu</b>
 <div class="mu" style="margin:4px 0">Trắc nghiệm: <code>Câu 1: …</code> / <code>A.</code> … <code>D.</code> / <code>Đáp án: B</code>. Đúng/Sai: các ý viết thường <code>a) b) c) d)</code> / <code>Đáp án: a-Đ, b-S, c-Đ, d-S</code>. Có thể thay dòng “Đáp án” bằng cách <u>gạch chân</u> hoặc in đậm đáp án đúng (hoặc gõ dấu * đầu dòng); chọn dạng Đúng/Sai thì ý được gạch chân là Đúng. Gõ “Câu 1:”, “A.” bằng tay, đừng dùng đánh số tự động của Word.</div>
 <div class="row"><label class="mu">📄 Nhập từ file Word (.docx): <input type="file" accept=".docx" onchange="impDocx(this)" style="width:auto"></label><a href="/de-mau.docx" download class="mu">Tải file Word mẫu</a></div>
 <textarea id="bulk" placeholder="…hoặc dán văn bản vào đây"></textarea><button onclick="bulk()" style="margin-top:6px">Thêm vào đề</button></div>
 <div id="qs"></div>
 <div class="row"><button onclick="addQ('mc')">+ Câu trắc nghiệm</button><button onclick="addQ('tf')">+ Câu Đúng/Sai</button><span class="sp"></span>
 <button onclick="location.hash='/'">Hủy</button><button class="p" onclick="saveEx()">Lưu đề</button></div>`;
 qs();
});
const newQ=t=>t==='tf'?{type:'tf',q:'',s:[0,1,2,3].map(()=>({t:'',a:true})),e:''}:{type:'mc',q:'',o:['','','',''],a:0,e:''};
const addQ=t=>{ed.questions.push(newQ(t));qs()};
function qs(){
 $('qs').innerHTML=ed.questions.map((q,i)=>{const tf=q.type==='tf';return `<div class="qe"><div class="row"><b>Câu ${i+1}</b><span class="mu">${tf?'Đúng/Sai':'Trắc nghiệm'}</span><span class="sp"></span><button class="d" onclick="ed.questions.splice(${i},1);qs()">Xóa</button></div>
 <textarea style="min-height:60px" placeholder="${tf?'Nội dung dẫn (đề bài chung của 4 ý)':'Nội dung câu hỏi'}" oninput="ed.questions[${i}].q=this.value">${esc(q.q)}</textarea>
 ${tf?q.s.map((s,j)=>`<div class="row"><b>${'abcd'[j]})</b><input class="sp" placeholder="Mệnh đề ${'abcd'[j]}" value="${esc(s.t)}" oninput="ed.questions[${i}].s[${j}].t=this.value">
 <select onchange="ed.questions[${i}].s[${j}].a=this.value==='1'"><option value="1" ${s.a?'selected':''}>Đúng</option><option value="0" ${s.a?'':'selected'}>Sai</option></select></div>`).join('')
 :q.o.map((o,j)=>`<div class="row"><input type="radio" name="r${i}" ${q.a===j?'checked':''} onchange="ed.questions[${i}].a=${j}"><b>${L[j]}</b><input class="sp" placeholder="Đáp án ${L[j]}" value="${esc(o)}" oninput="ed.questions[${i}].o[${j}]=this.value"></div>`).join('')}
 <input placeholder="Giải thích (không bắt buộc)" value="${esc(q.e)}" oninput="ed.questions[${i}].e=this.value"></div>`}).join('');
}
/* Phân tích văn bản → câu hỏi. lines: [{t:chuỗi, m:true nếu dòng được đánh dấu (gạch chân/in đậm)}] */
function parseQ(lines){
 const out=[],warn=[];let c=null,last=null;
 for(const x of lines){
  let l=x.t.trim(),mk=!!x.m,m;if(!l)continue;
  if(l[0]==='*'){mk=true;l=l.slice(1).trim()}
  if(m=l.match(/^c[âa]u\s*\d+\s*[:.)]\s*(.*)/i)){c={type:'mc',q:m[1],o:['','','',''],a:-1,s:[],e:'',known:false};out.push(c);last='q'}
  else if(!c)continue;
  else if(m=l.match(/^([a-d])\s*\)\s*(.*)/)){            // a) b) c) d) → mệnh đề Đúng/Sai
   const tm=m[2].match(/\s*\((đúng|sai|đ|s)\)\s*$/i);let a=mk;
   if(tm){a=/^đ/i.test(tm[1]);m[2]=m[2].slice(0,tm.index)}
   if(tm||mk)c.known=true;
   c.type='tf';c.s.push({t:m[2],a});last='o'}
  else if(m=l.match(/^([A-D])\s*[.)]\s*(.*)/)){           // A. B. C. D. → trắc nghiệm
   const j=L.indexOf(m[1]);c.o[j]=m[2];if(mk){c.a=j;c.known=true}last='o'}
  else if(m=l.match(/^đ[áa]p\s*[áa]n\s*[:.]?\s*(.*)/i)){
   const v=m[1];
   if(c.type==='tf'){
    const re=/([a-d])\s*[-:.)]?\s*(đúng|sai|đ|s)/gi;let r,n=0;
    while(r=re.exec(v)){const k='abcd'.indexOf(r[1].toLowerCase());if(c.s[k]){c.s[k].a=/^đ/i.test(r[2]);n++}}
    if(!n&&v.length<=11){const ch=v.replace(/[^ĐSđs]/g,'');if(ch.length===4){[...ch].forEach((z,k)=>{if(c.s[k])c.s[k].a=/đ/i.test(z)});n=4}}
    if(n)c.known=true;
   }else{const r=v.match(/[A-D]/i);if(r){c.a=L.indexOf(r[0].toUpperCase());c.known=true}}
   last='d'}
  else if(m=l.match(/^gi[ảa]i\s*th[íi]ch\s*[:.]?\s*(.*)/i)){c.e=m[1];last='e'}
  else if(last==='q')c.q+='\n'+l;
  else if(last==='e')c.e+=' '+l;
 }
 out.forEach((c,i)=>{
  if(c.type==='tf'){while(c.s.length<4)c.s.push({t:'',a:false});c.s=c.s.slice(0,4);delete c.o;delete c.a}
  else{delete c.s}
  if(!c.known){warn.push(`Câu ${i+1}: chưa nhận diện được đáp án đúng, hãy kiểm tra lại`);if(c.type==='mc')c.a=0}
  delete c.known;
 });
 return{out,warn};
}
function addParsed(r){
 if(!r.out.length)return alert('Không nhận diện được câu hỏi nào. Mỗi câu cần bắt đầu bằng "Câu 1:" và có đáp án A., B., C., D. (hoặc a), b), c), d) cho câu Đúng/Sai).');
 if(ed.questions.length===1&&!ed.questions[0].q)ed.questions=[];
 ed.questions.push(...r.out);qs();
 const tf=r.out.filter(q=>q.type==='tf').length;
 alert(`Đã nhập ${r.out.length} câu (${r.out.length-tf} trắc nghiệm, ${tf} đúng/sai).`+(r.warn.length?'\n\nCần kiểm tra:\n'+r.warn.slice(0,10).join('\n')+(r.warn.length>10?'\n…':''):''));
}
function bulk(){addParsed(parseQ($('bulk').value.split('\n').map(t=>({t,m:false}))));$('bulk').value=''}
const loadMammoth=()=>window.mammoth?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';s.onload=ok;s.onerror=()=>no(new Error('Không tải được thư viện đọc Word (cần kết nối mạng).'));document.head.appendChild(s)});
const impDocx=run(async inp=>{
 const f=inp.files[0];if(!f)return;
 if(!/\.docx$/i.test(f.name)){inp.value='';throw new Error('Chỉ hỗ trợ file .docx. Nếu là .doc, hãy mở bằng Word và "Lưu thành" .docx.')}
 await loadMammoth();
 const{value}=await mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()},{styleMap:['u => u']});
 const d=new DOMParser().parseFromString(value,'text/html');
 const lines=[...d.querySelectorAll('p,li')].filter(p=>!p.querySelector('p')).map(p=>{
  const t=p.textContent,n=t.trim().length,b=[...p.querySelectorAll('strong,b')].reduce((s,x)=>s+x.textContent.length,0);
  return{t,m:!!p.querySelector('u')||(n>0&&b>=0.6*n)}});
 inp.value='';addParsed(parseQ(lines));
});

const saveEx=run(async()=>{
 const b={title:ed.title,minutes:ed.minutes,shuffle:ed.shuffle,questions:ed.questions};
 ed._id==='new'?await api('/exams','POST',b):await api('/exams/'+ed._id,'PUT',b);
 location.hash='/';
});

/* ---------- Bảng điểm ---------- */
const results=run(async id=>{
 const d=await api('/exams/'+id+'/results'),r=d.results;
 const avg=r.length?(r.reduce((s,x)=>s+x.score,0)/r.length).toFixed(2):'–';
 A.innerHTML=`<div class="card"><div class="row"><h2 class="sp">${esc(d.title)}</h2><button onclick="location.hash='/'">← Quay lại</button></div>
 <p class="mu">${r.length} bài nộp · điểm trung bình ${avg}</p>
 <div style="overflow-x:auto"><table><tr><th>Họ tên</th><th>Điểm</th><th>Đúng</th><th>Nộp lúc</th></tr>
 ${r.map(x=>`<tr><td>${esc(x.name)}</td><td><b>${x.score}</b></td><td>${x.correct}/${x.total}</td><td>${new Date(x.created).toLocaleString('vi-VN')}</td></tr>`).join('')}</table></div>
 ${r.length?'<button style="margin-top:10px" onclick="csv()">Tải CSV</button>':''}</div>`;
 window.csv=()=>{const t='\ufeffHọ tên,Điểm,Đúng,Tổng,Thời gian\n'+r.map(x=>[`"${x.name.replace(/"/g,'""')}"`,x.score,x.correct,x.total,new Date(x.created).toLocaleString('vi-VN')].join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='bang-diem.csv';a.click()};
});

/* ---------- Học sinh ---------- */
let ex=null,ans=[],left=0,perm=[];
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const student=run(async code=>{
 ex=await api('/public/'+code);ex.code=code;
 A.innerHTML=`<div class="card" style="max-width:480px;margin:30px auto"><h2>${esc(ex.title)}</h2>
 <p class="mu">${ex.questions.length} câu · ${ex.minutes} phút</p><input id="nm" placeholder="Họ và tên của bạn">
 <button class="p" style="margin-top:8px" onclick="begin()">Bắt đầu làm bài</button></div>`;
});
const isDone=(q,a)=>q.type==='tf'?a.some(x=>x!==null):a>=0;
const unans=()=>ans.filter((a,i)=>!isDone(ex.questions[i],a)).length;
function begin(){
 const name=$('nm').value.trim();if(!name)return alert('Vui lòng nhập họ tên');ex.name=name;
 perm=ex.questions.map((q,i)=>{const o=q.type==='tf'?[]:[0,1,2,3].filter(j=>q.o[j].trim());return{qi:i,oi:ex.shuffle?shuf(o):o}});
 if(ex.shuffle)perm=shuf(perm);
 ans=ex.questions.map(q=>q.type==='tf'?q.s.map(()=>null):-1);left=ex.minutes*60;paint();
 tm=setInterval(()=>{left--;const t=$('t');if(t)t.textContent=fmt(left);if(left<=0)submit()},1000);
}
const fmt=s=>String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')+':'+String(Math.max(0,s)%60).padStart(2,'0');
function paint(){
 const y=scrollY;
 A.innerHTML=`<div class="card bar"><div class="row"><b class="sp">${esc(ex.title)}</b><span class="mu">${ans.length-unans()}/${ans.length}</span><span class="timer" id="t">${fmt(left)}</span></div></div>
 ${perm.map((p,n)=>{const q=ex.questions[p.qi],tf=q.type==='tf';return `<div class="card"><div class="mu">Câu ${n+1}${tf?' · Đúng/Sai: chọn Đúng hoặc Sai cho từng ý':''}</div><p style="white-space:pre-wrap;font-weight:600">${esc(q.q)}</p>
 ${tf?q.s.map((t,k)=>`<div class="row" style="padding:6px 0;border-top:1px solid var(--bd)"><span class="sp"><b>${'abcd'[k]})</b> ${esc(t)}</span>
 <button class="tb ${ans[p.qi][k]===true?'sel':''}" onclick="ans[${p.qi}][${k}]=true;paint()">Đúng</button><button class="tb ${ans[p.qi][k]===false?'sel':''}" onclick="ans[${p.qi}][${k}]=false;paint()">Sai</button></div>`).join('')
 :p.oi.map((j,k)=>`<button class="opt ${ans[p.qi]===j?'sel':''}" onclick="ans[${p.qi}]=${j};paint()"><b>${L[k]}.</b> ${esc(q.o[j])}</button>`).join('')}</div>`}).join('')}
 <button class="p" style="width:100%" onclick="if(confirm('Nộp bài? Còn '+unans()+' câu chưa làm.'))submit()">Nộp bài</button>`;
 scrollTo(0,y);
}
const submit=run(async()=>{
 clearInterval(tm);
 const d=await api('/public/'+ex.code+'/submit','POST',{name:ex.name,answers:ans});
 A.innerHTML=`<div class="card" style="text-align:center"><div class="mu">${esc(ex.name)}</div><div class="score">${d.score}/10</div><div>Đúng hoàn toàn ${d.correct}/${d.total} câu</div></div>
 ${perm.map((p,n)=>{const q=ex.questions[p.qi],rv=d.review[p.qi],a=ans[p.qi],tf=q.type==='tf';
 return `<div class="card"><div class="mu">Câu ${n+1} ${rv.pts===1?'✅':!isDone(q,a)?'⚪ Chưa làm':rv.pts>0?'🟡 '+rv.pts+'/1 điểm':'❌'}</div>
 <p style="white-space:pre-wrap;font-weight:600">${esc(q.q)}</p>
 ${tf?q.s.map((t,k)=>{const y=a[k],c=rv.s[k];return `<div class="opt ${y===c?'ok':'bad'}"><b>${'abcd'[k]})</b> ${esc(t)}<br><span class="mu">Bạn chọn: ${y===null?'—':y?'Đúng':'Sai'} · Đáp án: ${c?'Đúng':'Sai'}</span></div>`}).join('')
 :p.oi.map((j,k)=>`<div class="opt ${j===rv.a?'ok':a===j?'bad':''}"><b>${L[k]}.</b> ${esc(q.o[j])}</div>`).join('')}
 ${rv.e?`<div class="ex">💡 ${esc(rv.e)}</div>`:''}</div>`}).join('')}`;
});
route();
</script>
</body>
</html>
